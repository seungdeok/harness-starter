name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 skills/pipeline/scripts/pipeline.py selftest
      - run: npm i -g @anthropic-ai/claude-code
      - run: claude plugin validate .
